[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ipo-research"
version = "2.0.0"
description = "Reproducible IPO forecast studies and historical replay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2", "scikit-learn>=1.6"]

[project.scripts]
ipo-research = "ipo_research.__main__:main"
ipo-challengers = "ipo_research.expanded.__main__:main"

[project.optional-dependencies]
challengers = [
    "beautifulsoup4>=4.15.0",
    "catboost>=1.2.10",
    "pytorch-tabnet>=4.1.0",
    "xlrd>=2.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ipo_research.expanded" = ["*.sql"]

[dependency-groups]
dev = ["ruff==0.16.6"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["legacy", "*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
