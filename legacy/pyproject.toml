[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ipo-risk-engine"
version = "0.1.0"
description = "Event-driven IPO risk analysis engine"
requires-python = ">=3.10"
dependencies = [
  "alpaca-py>=0.10.0",
  "polars>=0.20.0",
  "python-dotenv>=1.0.0",
  "numpy>=1.24.0",
  "pyarrow>=14.0.0",
  "scikit-learn>=1.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
